name: CI

on:
  pull_request:
    branches:
      - main
      - "epic/**"

jobs:
  kbbl-typecheck:
    name: kbbl typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # --frozen-lockfile fails fast if bun.lock has drifted from
      # package.json — keeps CI builds reproducible against the
      # committed lock.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  kbbl-tests:
    name: kbbl backend tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test

  kbbl-pwa-tests:
    name: kbbl PWA tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test:pwa

  oakridge-dbos-tests:
    name: oakridge-dbos tests (bun)
    runs-on: ubuntu-latest
    # The end-to-end tests drive a real DBOS runtime, which needs a real
    # PostgreSQL. Without one they skip rather than fail, so CI provides it —
    # a silently-skipped e2e is indistinguishable from a passing one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oakridge
          POSTGRES_PASSWORD: oakridge
          POSTGRES_DB: oakridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OAKRIDGE_TEST_DATABASE_URL: postgres://oakridge:oakridge@127.0.0.1:5432/oakridge
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter oakridge-dbos test

  lbc-dashboard-tests:
    name: lbc-dashboard tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter lbc-dashboard test

  legit-biz-club:
    name: legit-biz-club checks (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legit-biz-club
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # --frozen fails fast if uv.lock has drifted from pyproject.toml,
      # matching the bun side's reproducibility guarantee.
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest

  oakridge-core:
    name: oakridge-core build & test (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oakridge-core
    env:
      # Build against the committed .sqlx offline metadata so CI needs no live
      # database for sqlx's compile-time query checking.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: oakridge-core
      # --locked fails fast if Cargo.lock has drifted from Cargo.toml,
      # matching the bun/uv reproducibility guarantee.
      - run: cargo build --locked --all-targets
      # The lifecycle e2e drives a mock-cc bash script (needs only bash + curl,
      # both present on ubuntu-latest); the real-CC smoke test is #[ignore]d, so
      # the default run needs no claude binary or auth.
      - run: cargo test --locked
