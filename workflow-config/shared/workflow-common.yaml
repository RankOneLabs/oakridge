input:
  title: text
  spec: text
  repositories: list(repository)
  primary_repository_key: ident
  final_merge_policy: final_merge_policy
schemas:
  final_merge_policy: enum(require_merge, allow_close_without_merge)
  repository:
    key: ident
    preparation:
      repository_path: repo_path
      expected_head: optional(text)
    forge: forge
  forge:
    namespace: ident
    path: ident
    build_base: text
    final_base: text
  workspace:
    repository_path: repo_path
    push_remote_owner: ident
    head: ident
    base_branch: text
  prepared:
    key: ident
    workspace: workspace
  pull_request_inspection:
    status: enum(open, merged, closed_unmerged)
    pr_sequence: integer
    observed_link: text
    head_sha: optional(text)
    merged_at: optional(text)
  severity: enum(blocking, warning, info)
  issue:
    description: text
    severity: severity
  test_evidence:
    passed: integer
    failing_tests: integer
    output: optional(text)
    test_notes: optional(text)
    cargo_test_output: optional(text)
  item_assessment:
    subject: assessment_subject
    status: enum(met, partial, not_met)
    observation: text
    supporting_citations: list(evidence_ref)
  assessment_body:
    head_sha: text
    item_assessments: list(item_assessment)
    additional_findings: list(additional_finding)
    proposals: list(feedback_proposal)
    verifications: list(assignment_verification)
    test_evidence: test_evidence
    verdict: enum(pass, pass_with_notes, fail)
  evidence_ref:
    kind: enum(file, test, output)
    citation_location: text
    detail: optional(text)
  pr_body:
    change_request_link: text
    branch: text
    change_overview: text
    review_status: optional(enum(draft, ready, changes_requested, approved, merged, closed))
decisions:
  accept_or_request:
    accept:
      effect: approve
      label: Accept
    request_changes:
      effect: request_changes
      label: Request changes
      fields:
        feedback: What must the proposed specification change?
workers:
  pr_watch:
    kind: code
    label: PR watcher
    operation: pull_request.inspect
    when: pr_opened
    inputs:
      query: "{owner: input.repository.forge.namespace, name: input.repository.forge.path,
        head_owner: input.workspace.push_remote_owner, head_branch:
        latest(pr).branch, base_branch: watch_base, pr_url: latest(pr).change_request_link}"
    every: 2m
    produces:
      - pr_state
reviews:
  pr_closed:
    of: build_result
    by: operator
    wait: external
    when: closed_pr
    prompt: development/pr-closed.md
    inputs:
      pr: latest(pr)
      pr_state: latest(pr_state)
    decisions:
      replace_pr:
        effect: request_changes
        label: Replace the closed PR
        fields:
          feedback: What must change in the replacement pull request?
stages:
  repository_setup:
    input:
      repository: repository
    artifacts:
      workspace:
        kind: record
        schema: workspace
    workers:
      git:
        kind: code
        label: Git
        operation: repository.prepare
        inputs:
          repository_path: input.repository.preparation.repository_path
          expected_head: input.repository.preparation.expected_head
          base_branch: input.repository.forge.build_base
          integration_branch: input.repository.forge.final_base
        produces:
          - workspace
    done_when: published(workspace)
    outcome:
      key: input.repository.key
      workspace: latest(workspace)
  integration:
    input:
      repository: repository
      workspace: workspace
      final_merge_policy: final_merge_policy
    artifacts:
      pr:
        kind: external_reference
        view: pull_request
        link_field: change_request_link
        schema: pr_body
      pr_state:
        kind: status_record
        schema: pull_request_inspection
      manual_merge_target:
        kind: external_reference
        view: pull_request
        link_field: change_request_link
        schema: pr_body
      observed_state:
        kind: status_record
        schema: pull_request_inspection
    workers:
      pr_watch:
        template: pr_watch
      prepare_manual_merge:
        kind: code
        label: Prepare manual merge
        operation: value.publish
        when: pr_published
        inputs:
          value: latest(pr)
        every: 2m
        produces:
          - manual_merge_target
      prepare_observed_state:
        kind: code
        label: Prepare observed state
        operation: value.publish
        when: pr_state_current
        inputs:
          value: latest(pr_state)
        every: 2m
        produces:
          - observed_state
    reviews:
      merge_confirmation:
        of: manual_merge_target
        by: operator
        wait: external
        confirms: merge
        when: published(manual_merge_target) and not final_state and not closed_pr and
          not approved(manual_merge_target)
        prompt: development/merge-confirmation.md
        inputs:
          pr: latest(pr)
          pr_state: latest(pr_state)
        decisions:
          confirm_merged:
            effect: approve
            label: Confirm merged
      pr_closed:
        template: pr_closed
        overrides:
          of: pr
    let:
      pr_published: published(pr)
      pr_opened: pr_published and latest(pr).change_request_link != ""
      watch_base: input.repository.forge.final_base
      pr_state_current: published(pr) and published(pr_state) and latest(pr_state).observed_link
        == latest(pr).change_request_link
      observed_state_current: published(pr) and published(observed_state) and
        latest(observed_state).observed_link == latest(pr).change_request_link
      closed_pr: input.final_merge_policy == "require_merge" and pr_state_current and
        latest(pr_state).status == "closed_unmerged"
      final_state: pr_state_current and (latest(pr_state).status == "merged" or
        (input.final_merge_policy == "allow_close_without_merge" and
        latest(pr_state).status == "closed_unmerged"))
    done_when: approved(assessment) and pr_published and
      (approved(manual_merge_target) or (observed_state_current and
      (latest(observed_state).status == "merged" or (input.final_merge_policy ==
      "allow_close_without_merge" and latest(observed_state).status ==
      "closed_unmerged"))))
    outcome:
      repository_key: input.repository.key
      change_request_link: latest(pr).change_request_link
      is_merged: approved(manual_merge_target) or (observed_state_current and
        latest(observed_state).status == "merged")
