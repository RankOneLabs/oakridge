name: CI

on:
  pull_request:
    branches:
      - main
      - "epic/**"

jobs:
  workflow-core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # shipped_definitions compiles the generated bundles.
      - run: bash scripts/generate-bundles.sh
        working-directory: .
      - run: cargo test --locked
      - run: cargo build --locked -p workflow-cli
      - uses: actions/upload-artifact@v4
        with:
          name: workflow-cli
          path: workflow-core/target/debug/workflow-cli
          if-no-files-found: error

  core-contracts:
    name: Generated Rust/TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: bash scripts/generate-core-contracts.sh --check
      - run: bunx tsc --noEmit -p workflow-config/src/tsconfig.json
      - run: bun test workflow-config/src
      - run: bash scripts/generate-bundles.sh --check

  workspace-typecheck:
    name: workspace typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # --frozen-lockfile fails fast if bun.lock has drifted from
      # package.json — keeps CI builds reproducible against the
      # committed lock.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun kbbl/scripts/generate-operator-contracts.ts --check

  kbbl-tests:
    name: kbbl backend tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test

  kbbl-pwa-tests:
    name: kbbl PWA tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test:pwa

  kbbl-browser-tests:
    name: kbbl browser tests (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd kbbl && bunx playwright install --with-deps chromium
      - run: bun run --filter kbbl test:browser

  oakridge-dbos-unit-tests:
    name: oakridge-dbos unit tests (bun)
    needs: workflow-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workflow-cli
          path: workflow-core/target/debug
      - run: chmod +x workflow-core/target/debug/workflow-cli
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter oakridge-dbos test:unit

  oakridge-dbos-tests:
    name: oakridge-dbos integration tests (bun, shard ${{ matrix.shard }})
    needs: workflow-core
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    # The end-to-end tests drive a real DBOS runtime, which needs a real
    # PostgreSQL. Missing prerequisites fail rather than silently skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oakridge
          POSTGRES_PASSWORD: oakridge
          POSTGRES_DB: oakridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OAKRIDGE_TEST_DATABASE_URL: postgres://oakridge:oakridge@127.0.0.1:5432/oakridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workflow-cli
          path: workflow-core/target/debug
      - run: chmod +x workflow-core/target/debug/workflow-cli
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run DBOS integration shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: "2"
          OAKRIDGE_ENABLE_RAW_INGRESS: "1"
        run: bun run --filter oakridge-dbos test:integration

  lbc-dashboard-tests:
    name: lbc-dashboard tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter lbc-dashboard test

  legit-biz-club:
    name: legit-biz-club checks (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legit-biz-club
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # --frozen fails fast if uv.lock has drifted from pyproject.toml,
      # matching the bun side's reproducibility guarantee.
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest
