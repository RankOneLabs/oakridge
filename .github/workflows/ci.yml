name: CI

on:
  pull_request:
    branches:
      - main
      - "epic/**"

jobs:
  workflow-core:
    name: Rust core (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked -p workflow-cli

  core-contracts:
    name: Generated Rust/TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: bash scripts/generate-core-contracts.sh --check

  workspace-typecheck:
    name: workspace typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # --frozen-lockfile fails fast if bun.lock has drifted from
      # package.json — keeps CI builds reproducible against the
      # committed lock.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  kbbl-tests:
    name: kbbl backend tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test

  kbbl-pwa-tests:
    name: kbbl PWA tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test:pwa

  oakridge-dbos-tests:
    name: oakridge-dbos tests (bun, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    # The end-to-end tests drive a real DBOS runtime, which needs a real
    # PostgreSQL. Missing prerequisites fail rather than silently skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oakridge
          POSTGRES_PASSWORD: oakridge
          POSTGRES_DB: oakridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OAKRIDGE_TEST_DATABASE_URL: postgres://oakridge:oakridge@127.0.0.1:5432/oakridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: cargo build --locked --manifest-path workflow-core/Cargo.toml -p workflow-cli
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd oakridge-dbos && bunx playwright install --with-deps chromium
      - name: Run DBOS test shard
        working-directory: oakridge-dbos
        env:
          TEST_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          # Each file keeps its own process because DBOS has global runtime state.
          # Alternating sorted files assigns every test to exactly one runner.
          mapfile -d '' test_files < <(find src tests -name '*.test.ts' -print0 | sort -z)
          test "${#test_files[@]}" -gt 0
          failed=0
          for ((index = TEST_SHARD; index < ${#test_files[@]}; index += 2)); do
            bun test "${test_files[index]}" || failed=1
          done
          exit "$failed"

  lbc-dashboard-tests:
    name: lbc-dashboard tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter lbc-dashboard test

  legit-biz-club:
    name: legit-biz-club checks (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legit-biz-club
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # --frozen fails fast if uv.lock has drifted from pyproject.toml,
      # matching the bun side's reproducibility guarantee.
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run pytest
