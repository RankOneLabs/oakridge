# Canonical requirements flow through analysis, spec, cohort allocations and resolved briefs.
# Both assessment scopes share evidence and typed feedback proposals.
# See README.md for the remaining upstream engine/adapter blockers (B1, B2, B9).
workflow: development
include: [shared/workflow-common.yaml]
schemas:
  completed_cohort: outcome_of(cohort)
  finding_evidence:
    kind: enum(file, search, test, output)
    ref: text
    detail: text
  change_location:
    path: text
    symbol: optional(text)
  resolution:
    kind: enum(spec_update, operator_decision, implementation_note)
    text: text
    question: optional(text)
    alternatives: "optional(list({option: text, consequence: text}))"
    chosen: optional(text)
  analysis_finding:
    id: ident
    severity: severity
    observation: text
    evidence: list(finding_evidence)
    expected_change_locations: list(change_location)
    resolution: optional(resolution)
  analysis_requirement:
    id: ident
    text: text
    source_refs: list(text)
    findings: list(analysis_finding)
  analysis_body:
    requirements: list(analysis_requirement)
  spec_requirement:
    id: ident
    text: text
    acceptance_conditions: list(text)
    source_refs: list(text)
    analysis_finding_ids: list(ident)
  spec_body:
    objective: text
    requirements: list(spec_requirement)
    non_goals: list(text)
  allocation:
    requirement_id: ident
    contribution: text
  plan_cohort:
    id: ident
    repository_key: ident
    title: text
    scope: text
    allocations: list(allocation)
    depends_on: list(ident)
    rationale: text
  plan_body:
    cohorts: list(plan_cohort)
  cohort_assignment:
    cohort: plan_cohort
    requirements: list(spec_requirement)
  build_item:
    id: ident
    requirement_ids: list(ident)
    instructions: text
    verification: list(text)
  technical_decision:
    id: ident
    build_item_ids: list(ident)
    decision: text
    rationale: text
  brief_body:
    cohort_id: ident
    repository_key: ident
    depends_on: list(ident)
    files_in_scope: list(text)
    build_items: list(build_item)
    technical_decisions: list(technical_decision)
  build_body:
    repository_key: optional(ident)
    head_sha: text
    summary: text
    changed_files: list(text)
    tests: test_evidence
    delegated_session_metadata: optional(build_metadata)
    known_issues: list(issue)
  build_metadata:
    cohort_id: optional(ident)
    session_id: optional(ident)
    branch: optional(ident)
  assessment_subject:
    kind: enum(build_item, requirement)
    id: ident
  additional_finding:
    id: ident
    severity: severity
    observation: text
    related_build_item_ids: list(ident)
    evidence: list(evidence_ref)
run:
  pools:
    writers: 4
    builders: 4
  units:
    prepare:
      for_each: input.repositories
      key: each.key
      stage: prepare
      input:
        repository: each
    analysis:
      stage: analysis
      input:
        spec: input.spec
        workspace: require(lookup(map(prepare, prepare.outcome), key, input.primary_repository_key)).workspace
    planning:
      stage: planning
      input:
        spec: analysis.outcome.spec
        repositories: input.repositories
        workspace: require(lookup(map(prepare, prepare.outcome), key, input.primary_repository_key)).workspace
    briefs:
      for_each: planning.outcome.plan.cohorts
      key: each.id
      order: planning.outcome.order
      stage: brief
      pool: writers
      input:
        assignment: "{cohort: each, requirements: filter(analysis.outcome.spec.requirements, contains(map(each.allocations, item.requirement_id), item.id))}"
        workspace: require(lookup(map(prepare, prepare.outcome), key, input.primary_repository_key)).workspace
    implementation:
      for_each: map(briefs, briefs.outcome.brief)
      key: each.cohort_id
      after: require(lookup(planning.outcome.plan.cohorts, id, each.cohort_id)).depends_on
      stage: cohort
      pool: builders
      input:
        brief: each
        repository: require(lookup(input.repositories, key, each.repository_key))
        workspace: require(lookup(map(prepare, prepare.outcome), key, each.repository_key)).workspace
        cohort: require(lookup(planning.outcome.plan.cohorts, id, each.cohort_id))
    integration:
      for_each: filter(input.repositories, contains(map(implementation, implementation.outcome.repository_key), item.key))
      key: each.key
      stage: integration
      input:
        repository: each
        workspace: require(lookup(map(prepare, prepare.outcome), key, each.key)).workspace
        cohorts: filter(map(implementation, implementation.outcome), item.repository_key == each.key)
        briefs: filter(map(briefs, briefs.outcome.brief), item.repository_key == each.key)
        final_merge_policy: input.final_merge_policy
        requirements: filter(analysis.outcome.spec.requirements, contains(flatten(map(filter(map(briefs, briefs.outcome.brief), item.repository_key == each.key), flatten(map(item.build_items, item.requirement_ids)))), item.id))
  outcome:
    cohorts: map(implementation, implementation.outcome)
    integrations: map(integration, integration.outcome)
stages:
  analysis:
    input:
      spec: text
      workspace: workspace
    artifacts:
      analysis:
        kind: document
        schema: analysis_body
        validate:
          - check: unique(map(analysis.requirements, item.id))
            message: Requirement ids must be unique.
          - check: every(analysis.requirements, len(item.source_refs) > 0)
            message: Every requirement must cite at least one source reference.
          - check: every(analysis.requirements, len(item.findings) > 0)
            message: Every requirement needs at least one finding.
          - check: unique(map(flatten(map(analysis.requirements, item.findings)), item.id))
            message: Finding ids must be unique across the analysis.
          - check: 'every(flatten(map(analysis.requirements, item.findings)), not present(item.resolution) or require(item.resolution).kind != "operator_decision" or (present(require(item.resolution).question) and present(require(item.resolution).alternatives) and len(require(require(item.resolution).alternatives)) >= 2))'
            message: An operator_decision resolution needs a question and at least two alternatives.
      spec:
        kind: document
        schema: spec_body
        validate:
          - check: published(analysis) and unique(map(spec.requirements, item.id))
            message: Specification requirement ids must be unique.
          - check: published(analysis) and every(map(latest(analysis).requirements, item.id), contains(map(spec.requirements, item.id), item))
            message: Every approved analysis requirement must appear in the specification.
          - check: published(analysis) and every(spec.requirements, contains(map(latest(analysis).requirements, item.id), item.id))
            message: Specification requirement ids must belong to the approved analysis.
          - check: published(analysis) and every(flatten(map(spec.requirements, item.analysis_finding_ids)), contains(flatten(map(latest(analysis).requirements, map(item.findings, item.id))), item))
            message: Specification finding links must name approved analysis findings.
          - check: published(analysis) and every(spec.requirements, len(item.acceptance_conditions) > 0)
            message: Every specification requirement needs at least one acceptance condition.
    workers:
      author:
        kind: agent
        prompts:
          initial: development/analysis.md
          revise: development/analysis-revise.md
        inputs:
          spec: input.spec
        workspace: repository(input.workspace)
        produces:
          - analysis
      spec_editor:
        kind: agent
        when: approved(analysis)
        prompts:
          initial: development/analysis-to-spec.md
          revise: development/analysis-to-spec-revise.md
        inputs:
          original_spec: input.spec
          approved_analysis: latest(analysis)
        workspace: repository(input.workspace)
        produces:
          - spec
    reviews:
      analysis_review:
        of: analysis
        by: operator
        prompt: development/analysis-review.md
        inputs:
          original_spec: input.spec
          analysis: latest(analysis)
        decisions:
          accept:
            effect: approve
            label: Accept
            when:
              check: 'every(flatten(map(analysis.requirements, item.findings)), item.severity != "blocking" and (not present(item.resolution) or require(item.resolution).kind != "operator_decision" or (default(require(item.resolution).chosen, "") != "" and contains(map(require(require(item.resolution).alternatives), item.option), default(require(item.resolution).chosen, "")))))'
              reason: Resolve every blocking finding and choose an option for every operator decision before accepting the analysis.
          request_changes:
            effect: request_changes
            label: Request changes
            fields:
              feedback: What must the analysis change?
      spec_review:
        of: spec
        by: operator
        prompt: development/spec-review.md
        inputs:
          original_spec: input.spec
          approved_analysis: latest(analysis)
          spec: latest(spec)
        decisions:
          accept:
            effect: approve
            label: Accept
          request_changes:
            effect: request_changes
            label: Request changes
            fields:
              feedback: What must the canonical specification change?
          request_analysis_changes:
            effect: request_changes
            on: analysis
            label: Request analysis changes
            fields:
              feedback: What must the analysis change?
    done_when: approved(analysis) and approved(spec)
    outcome:
      spec: latest(spec)
  planning:
    input:
      spec: spec_body
      repositories: list(repository)
      workspace: workspace
    artifacts:
      plan:
        kind: document
        schema: plan_body
        validate:
          - check: len(plan.cohorts) > 0
            message: The plan must name at least one cohort.
          - check: every(plan.cohorts, contains(map(input.repositories, item.key), item.repository_key))
            message: Every cohort's repository_key must be the key of one of the run's repositories.
          - check: valid_graph(plan.cohorts, id, depends_on)
            message: Cohort ids must be unique idents, and each depends_on must name other cohorts without repeats or a cycle.
          - check: every(plan.cohorts, every(item.allocations, contains(map(input.spec.requirements, item.id), item.requirement_id)))
            message: Every allocation must name a canonical specification requirement.
          - check: every(map(input.spec.requirements, item.id), contains(flatten(map(plan.cohorts, map(item.allocations, item.requirement_id))), item))
            message: Every specification requirement must be allocated to at least one cohort.
          - check: every(plan.cohorts, unique(map(item.allocations, item.requirement_id)))
            message: A requirement may be allocated only once within a cohort.
          - check: every(plan.cohorts, len(item.allocations) > 0)
            message: Every cohort needs at least one allocation.
    workers:
      planner:
        kind: agent
        prompts:
          initial: development/plan.md
          revise: development/plan-revise.md
        inputs:
          spec: input.spec
          repository_keys: map(input.repositories, item.key)
        workspace: repository(input.workspace)
        produces:
          - plan
    reviews:
      plan_review:
        of: plan
        by: operator
        prompt: development/plan-review.md
        inputs:
          spec: input.spec
          plan: latest(plan)
        decisions:
          set: accept_or_request
          overrides:
            request_changes:
              fields:
                feedback: What must the plan change?
    done_when: approved(plan)
    outcome:
      plan: latest(plan)
      order: levels(latest(plan).cohorts, id, depends_on)
  brief:
    input:
      assignment: cohort_assignment
      workspace: workspace
    artifacts:
      brief:
        kind: document
        schema: brief_body
        validate:
          - check: brief.cohort_id == input.assignment.cohort.id
            message: The brief's cohort_id must be its plan cohort's id.
          - check: brief.repository_key == input.assignment.cohort.repository_key
            message: The brief's repository_key must be its plan cohort's.
          - check: brief.depends_on == input.assignment.cohort.depends_on
            message: The brief's depends_on must be its plan cohort's, in the same order.
          - check: unique(map(brief.build_items, item.id))
            message: Build-item ids must be unique.
          - check: every(map(input.assignment.requirements, item.id), contains(flatten(map(brief.build_items, item.requirement_ids)), item))
            message: Every assigned requirement must appear in a build item.
          - check: every(flatten(map(brief.build_items, item.requirement_ids)), contains(map(input.assignment.requirements, item.id), item))
            message: Build-item requirement ids must belong to the resolved assignment.
          - check: every(brief.build_items, len(item.requirement_ids) > 0 and len(item.verification) > 0)
            message: Every build item needs at least one requirement and one verification entry.
          - check: every(brief.build_items, len(item.instructions) > 0)
            message: Every build item needs nonempty instructions.
          - check: unique(map(brief.technical_decisions, item.id))
            message: Technical decision ids must be unique.
          - check: every(flatten(map(brief.technical_decisions, item.build_item_ids)), contains(map(brief.build_items, item.id), item))
            message: Technical decision links must name brief build items.
    workers:
      writer:
        kind: agent
        session: shared
        prompts:
          initial: development/brief.md
          revise: development/brief-revise.md
        inputs:
          assignment: input.assignment
        workspace: repository(input.workspace)
        produces:
          - brief
    reviews:
      brief_review:
        of: brief
        by: operator
        prompt: development/brief-review.md
        inputs:
          assignment: input.assignment
          brief: latest(brief)
        decisions:
          set: accept_or_request
          overrides:
            request_changes:
              fields:
                feedback: What must the brief change?
    done_when: approved(brief)
    outcome:
      brief: latest(brief)
  cohort:
    input:
      brief: brief_body
      repository: repository
      workspace: workspace
      cohort: plan_cohort
    let:
      brief_value: input.brief
      watch_base: input.repository.forge.build_base
      pr_published: published(pr)
      pr_opened: pr_published and latest(pr).pr_url != ""
      pr_state_current: published(pr) and published(pr_state) and latest(pr_state).url == latest(pr).pr_url
      observed_state_current: published(pr) and published(observed_state) and latest(observed_state).url == latest(pr).pr_url
      closed_pr: pr_state_current and latest(pr_state).state == "closed_unmerged"
      merged_pr: observed_state_current and latest(observed_state).state == "merged"
    artifacts:
      build_result:
        kind: document
        schema: build_body
      pr:
        kind: external_reference
        schema: pr_body
      assessment:
        kind: assessment
        schema: assessment_body
        edit_policy:
          kind: frozen_when_accepted
        validate:
          - check: every(assessment.item_assessments, item.subject.kind == "build_item")
            message: Cohort assessment items must be build items.
          - check: every(map(input.brief.build_items, item.id), contains(map(assessment.item_assessments, item.subject.id), item))
            message: Every brief build item must be assessed.
          - check: every(assessment.item_assessments, contains(map(input.brief.build_items, item.id), item.subject.id))
            message: Cohort assessment items must name brief build items.
          - check: every(flatten(map(assessment.additional_findings, item.related_build_item_ids)), contains(map(input.brief.build_items, item.id), item))
            message: Additional finding links must name brief build items.
          - check: published(build_result) and assessment.head_sha == latest(build_result).head_sha
            message: Assessment head_sha must match the latest build result.
          - &a1
            check: unique(map(assessment.item_assessments, item.subject.id))
            message: Assessment item ids must be unique.
          - &a2
            check: unique(map(assessment.additional_findings, item.id))
            message: Additional finding ids must be unique.
          - &a4
            check: (assessment.verdict == "fail" and (len(filter(assessment.item_assessments, item.status != "met")) > 0 or len(filter(assessment.additional_findings, item.severity == "blocking")) > 0)) or (assessment.verdict == "pass_with_notes" and not (len(filter(assessment.item_assessments, item.status != "met")) > 0 or len(filter(assessment.additional_findings, item.severity == "blocking")) > 0) and (len(filter(assessment.additional_findings, item.severity == "warning")) > 0)) or (assessment.verdict == "pass" and not (len(filter(assessment.item_assessments, item.status != "met")) > 0 or len(filter(assessment.additional_findings, item.severity == "blocking")) > 0) and not (len(filter(assessment.additional_findings, item.severity == "warning")) > 0))
            message: Assessment verdict must match item statuses and additional finding severities.
          - &a5
            check: assessment.test_evidence.failed == 0 or (len(filter(assessment.item_assessments, item.status != "met")) > 0 or len(filter(assessment.additional_findings, item.severity == "blocking")) > 0) or (len(filter(assessment.additional_findings, item.severity == "warning")) > 0)
            message: Failed tests require an unmet item or a blocking or warning additional finding.
      pr_state:
        kind: status_record
        schema: pr_status
      observed_state:
        kind: status_record
        schema: pr_status
    workers:
      builder:
        kind: agent
        prompts:
          initial: development/build.md
          revise: development/build-revise.md
        inputs:
          brief: brief_value
          repository: input.repository
          build_base: input.repository.forge.build_base
        workspace: repository(input.workspace)
        produces:
          - build_result
          - pr
      assessor:
        kind: agent
        prompts:
          review: development/assess.md
          revise: development/assess-revise.md
        inputs:
          brief: brief_value
          pr: latest(pr)
        workspace: repository(input.workspace)
        evaluates: build_result
        produces:
          - assessment
      pr_watch:
        template: pr_watch
      prepare_observed_state:
        kind: code
        operation: value.publish
        when: pr_state_current
        inputs:
          value: latest(pr_state)
        every: 2m
        produces:
          - observed_state
    reviews:
      assessment_review:
        of: assessment
        by: operator
        prompt: development/assessment-review.md
        inputs:
          brief: input.brief
          build_result: latest(build_result)
          pr: latest(pr)
          assessment: latest(assessment)
        decisions:
          accept:
            effect: approve
            operation: approve_assessment
            label: Accept
          request_assessment_changes:
            effect: request_changes
            label: Request assessment changes
            fields:
              feedback: What must the assessment change?
          request_build_changes:
            effect: request_changes
            operation: dispatch_feedback
            on: build_result
            label: Send to builder
      merge_confirmation:
        of: pr
        by: operator
        when: pr_published and approved(assessment) and not merged_pr and not approved(pr)
        prompt: development/merge-confirmation.md
        inputs:
          pr: latest(pr)
          pr_state: latest(pr_state)
        decisions:
          confirm_merged:
            effect: approve
            label: Confirm merged
      pr_closed:
        template: pr_closed
    done_when: approved(assessment) and published(build_result) and pr_published and (merged_pr or approved(pr))
    outcome:
      cohort_id: brief_value.cohort_id
      repository_key: input.brief.repository_key
      title: input.cohort.title
      pr_url: latest(pr).pr_url
      branch: latest(pr).branch
      build_result: latest(build_result)
  integration:
    input:
      cohorts: list(completed_cohort)
      briefs: list(brief_body)
      requirements: list(spec_requirement)
    artifacts:
      assessment:
        kind: assessment
        schema: assessment_body
        edit_policy:
          kind: frozen_when_accepted
        validate:
          - check: every(assessment.item_assessments, item.subject.kind == "requirement")
            message: Integration assessment items must be canonical requirements.
          - check: every(map(input.requirements, item.id), contains(map(assessment.item_assessments, item.subject.id), item))
            message: Every integration requirement must be assessed.
          - check: every(assessment.item_assessments, contains(map(input.requirements, item.id), item.subject.id))
            message: Integration assessment items must name applicable canonical requirements.
          - *a1
          - *a2
          - *a4
          - *a5
    workers:
      integrator:
        kind: agent
        prompts:
          initial: development/integrate.md
          revise: development/integrate-revise.md
        inputs:
          repository: input.repository
          cohorts: input.cohorts
          briefs: input.briefs
          requirements: input.requirements
        workspace: repository(input.workspace)
        produces:
          - pr
          - assessment
    reviews:
      integration_review:
        of: assessment
        by: operator
        prompt: development/integration-review.md
        inputs:
          repository: input.repository
          cohorts: input.cohorts
          briefs: input.briefs
          assessment: latest(assessment)
          pr: latest(pr)
          pr_state: latest(pr_state)
          requirements: input.requirements
        decisions:
          accept:
            effect: approve
            operation: approve_assessment
            label: Accept
          request_changes:
            effect: request_changes
            operation: dispatch_feedback
            label: Send to integrator
            on: assessment
