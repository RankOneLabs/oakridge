name: CI

on:
  pull_request:
    branches:
      - main
      - "epic/**"

jobs:
  workflow-core:
    name: Rust core (fmt, clippy, test)
    needs: core-contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun workflow-config/src/generate.ts --check
        working-directory: .
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  workflow-core-wasm:
    name: Rust core (WASM build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workflow-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: cargo build --locked --target wasm32-unknown-unknown

  core-wasm-client:
    name: Bun WASM core client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: cargo build --locked --target wasm32-unknown-unknown -p workflow-evaluator
        working-directory: workflow-core
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test oakridge-dbos/tests/core-fixture-parity.test.ts

  core-contracts:
    name: Generated Rust/TypeScript contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: bash scripts/generate-core-contracts.sh --check
      - run: bun workflow-config/src/generate.ts --check
      - run: bunx tsc --noEmit -p workflow-config/src/tsconfig.json
      - run: bun test workflow-config/src

  workspace-typecheck:
    name: workspace typecheck (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      # --frozen-lockfile fails fast if bun.lock has drifted from
      # package.json — keeps CI builds reproducible against the
      # committed lock.
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p oakridge-dbos/tsconfig.json
      - run: bun kbbl/scripts/generate-operator-contracts.ts --check
      - run: bunx tsc --noEmit -p kbbl/tsconfig.json

  kbbl-tests:
    name: kbbl backend tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test

  kbbl-pwa-tests:
    name: kbbl PWA tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter kbbl test:pwa

  kbbl-browser-tests:
    name: kbbl browser tests (Chromium)
    runs-on: ubuntu-latest
    # Both browser tests serve fixture responses with Bun.serve and need neither
    # the database nor the WASM core.
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd kbbl && bunx playwright install --with-deps chromium
      - run: bun run --filter kbbl test:browser

  oakridge-dbos-unit-tests:
    name: oakridge-dbos unit tests (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: cargo build --locked --target wasm32-unknown-unknown -p workflow-evaluator
        working-directory: workflow-core
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter oakridge-dbos test:unit

  oakridge-dbos-tests:
    name: oakridge-dbos integration tests (bun, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    # The end-to-end tests drive a real DBOS runtime, which needs a real
    # PostgreSQL. Missing prerequisites fail rather than silently skip.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oakridge
          POSTGRES_PASSWORD: oakridge
          POSTGRES_DB: oakridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OAKRIDGE_TEST_DATABASE_URL: postgres://oakridge:oakridge@127.0.0.1:5432/oakridge
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: workflow-core
      - run: cargo build --locked --target wasm32-unknown-unknown -p workflow-evaluator
        working-directory: workflow-core
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Check generated storage records
        if: matrix.shard == 0
        run: bun oakridge-dbos/scripts/generate-storage-records.ts --check
      - name: Run DBOS integration shard
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: "2"
        run: bun run --filter oakridge-dbos test:integration
