workflow: template_override
input: { topic: text }
workers:
  writer:
    kind: agent
    prompts: { initial: template-override/default.md }
    inputs: { topic: input.topic }
    creates: [draft]
run:
  units:
    document: { stage: document, input: { topic: input.topic } }
  outcome: { draft: document.outcome.draft }
stages:
  document:
    input: { topic: text }
    artifacts: { draft: { schema: text } }
    workers:
      writer:
        template: writer
        overrides: { prompts: { initial: template-override/override.md } }
    done_when: published(draft)
    outcome: { draft: latest(draft) }
